services:
  - type: web
    name: student-feedback-intelligence-3-0-api
    runtime: python
    region: oregon
    plan: free
    rootDir: student-feedback-intelligence
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://student-feedback-intelligence-3-0.vercel.app,https://student-feedback-intelligence.vercel.app,http://localhost:5173
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "10000"
    healthCheckPath: /health
